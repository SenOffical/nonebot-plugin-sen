[tool.nonebot]
adapters = ["nonebot-adapter-onebot", "nonebot-adapter-telegram"]
plugins = ["sen_bot"]
plugin_dirs = ["sen_bot"]

[project]
name = "sen-nonebot2"
version = "0.1.0"
description = "NoneBot2 implementation for Sen bot commands"
requires-python = ">=3.12"
dependencies = [
    "nonebot2[fastapi]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-adapter-telegram>=0.1.0b20,<0.2.0",
    "httpx>=0.28.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
